name: Build Custom Telegram X

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出源码与子模块
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 2. 配置 JDK 17 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 3. 缓存编译好的 TDLib 动态库 (跳过耗时的 C++ 重编)
        uses: actions/cache@v4
        with:
          path: |
            tdlib/lib/
            app/src/main/jniLibs/
            app/.cxx/
          key: tdlib-prebuilt-${{ hashFiles('tdlib/**') }}

      - name: 4. 注入 Telegram API 配置
        run: |
          echo "telegram.api_id=${{ secrets.TG_API_ID }}" >> local.properties
          echo "telegram.api_hash=${{ secrets.TG_API_HASH }}" >> local.properties

      - name: 5. 赋予 Gradle 执行权限并编译 Debug 包
        run: |
          chmod +x gradlew
          ./gradlew assembleUniversalDebug --stacktrace

      - name: 6. 上传编译好的 APK 供手机下载
        uses: actions/upload-artifact@v4
        with:
          name: Telegraph-X-Debug-APK
          path: app/build/outputs/apk/**/debug/*.apk
